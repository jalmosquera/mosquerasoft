name: PR validation

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-pr:
    name: Check PR metadata
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request
            const owner = context.repo.owner
            const repo = context.repo.repo

            const labels = pullRequest.labels.map((label) => label.name)
            const typeLabels = labels.filter((label) =>
              label.startsWith("type:")
            )

            if (typeLabels.length !== 1) {
              core.setFailed(
                `Expected exactly one type:* label, found ${typeLabels.length}`
              )
            }

            const linkedIssue = pullRequest.body?.match(
              /\b(?:closes|fixes|resolves)\s+#(\d+)\b/i
            )

            if (!linkedIssue) {
              core.setFailed(
                "Pull request body must contain Closes #N, Fixes #N, or Resolves #N"
              )
              return
            }

            const issueNumber = Number(linkedIssue[1])
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            })

            if (issue.pull_request) {
              core.setFailed(`#${issueNumber} is a pull request, not an issue`)
              return
            }

            const issueLabels = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name
            )

            if (!issueLabels.includes("status:approved")) {
              core.setFailed(
                `Linked issue #${issueNumber} does not have status:approved`
              )
            }

            const branchPattern =
              /^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)\/[a-z0-9._-]+$/

            const isIntegrationPullRequest =
              pullRequest.head.ref === "dev" &&
              pullRequest.base.ref === "main"

            if (
              !isIntegrationPullRequest &&
              !branchPattern.test(pullRequest.head.ref)
            ) {
              core.setFailed(
                `Invalid branch name: ${pullRequest.head.ref}`
              )
            }
