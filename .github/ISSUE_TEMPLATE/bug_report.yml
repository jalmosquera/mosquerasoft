name: Bug report
description: Report reproducible incorrect behavior
title: "fix: "
labels:
  - bug
  - status:needs-review
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I understand this issue requires approval before implementation
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe the incorrect behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the minimum steps needed to reproduce the problem.
      placeholder: |
        1. Start...
        2. Send...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Agent or client
      options:
        - Codex
        - Browser
        - API client
        - Other
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - fish
        - zsh
        - bash
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Add sanitized logs or error messages when available.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, workarounds, or other useful details.
