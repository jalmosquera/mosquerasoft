name: Feature request
description: Propose a feature, improvement, or technical task
labels:
  - enhancement
  - status:needs-review
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I understand this issue requires approval before implementation
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or need should this work address?
      placeholder: Explain the current limitation or objective.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the expected result without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable conditions required to consider this work complete.
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backend
        - Frontend
        - Infrastructure
        - CI / GitHub
        - Documentation
        - Other
    validations:
      required: true
