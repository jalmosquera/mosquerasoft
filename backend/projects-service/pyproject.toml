[project]
name = "projects-service"
version = "0.1.0"
description = "Project management service for Mosquera Soft"
readme = "README.md"
authors = [
    { name = "Jalberth Mosquera", email = "jmosquera2305@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
]
